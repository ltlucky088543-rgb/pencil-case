<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pencil Case</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-layout="side">
  <header id="bar">
    <h1 id="logo">Pencil Case</h1>
    <dl id="stats">
      <div><dt>Wave</dt><dd id="stat-wave">0 / 50</dd></div>
      <div><dt>Stars</dt><dd id="stat-lives">20</dd></div>
      <div><dt><span class="wide">Lunch </span>Money</dt><dd id="stat-money">$60</dd></div>
    </dl>
    <div id="controls">
      <button id="btn-speed" class="icon" type="button" title="Game speed (F)">1×</button>
      <button id="btn-pause" class="icon" type="button" title="Pause (P)" aria-label="Pause">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h4v14H5zM11 3h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <button id="btn-sound" class="icon" type="button" title="Sound (M)" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5v5h3l4.5 4v-13L6 7.5z" fill="currentColor"/><path class="waves" d="M13 7a4 4 0 0 1 0 6M15 4.8a7 7 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-help" class="icon" type="button" title="How to play (H)">?</button>
    </div>
  </header>

  <main id="stage">
    <div id="sheet">
      <canvas id="board" aria-label="Game board. Drag supplies onto it, and drag them onto each other to merge them."></canvas>
      <p id="hint" role="status" hidden></p>
      <div id="banner"></div>
    </div>
  </main>

  <aside id="tray">
    <section id="shop" aria-label="Buy supplies">
      <div id="items"></div>
      <div id="shop-foot">
        <p id="price"></p>
        <button id="btn-book" type="button" title="Recipe book (B)">Recipe book</button>
      </div>
      <div id="sell" hidden>Drop here to sell for <b id="sell-value">$0</b></div>
    </section>
    <section id="next">
      <button id="btn-send" type="button">Start wave 1</button>
      <p id="next-text"></p>
    </section>
    <section id="inspect">
      <figure id="chart">
        <h2>You could make</h2>
        <ul id="recipes"></ul>
        <figcaption>Any two supplies of the <b>same level</b> merge. Two fusions can make an <b>advanced fusion</b>.</figcaption>
      </figure>
      <div id="card" hidden>
        <div id="card-head">
          <img id="card-icon" src="data:," alt="">
          <div>
            <h2 id="card-name"></h2>
            <p id="card-detail"></p>
          </div>
        </div>
        <p id="card-blurb"></p>
        <dl id="card-stats"></dl>
        <button id="btn-sell" type="button"></button>
      </div>
    </section>
  </aside>
</div>

<div id="ghost" hidden></div>
<div id="modal" hidden></div>

<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/minigames.js"></script>
<script src="js/main.js"></script>
</body>
</html>
